services:
  # Base de datos relacional PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: local_postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app_dev}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dev_network

  # Cache y Broker en memoria Redis
  redis:
    image: redis:7-alpine
    container_name: local_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - dev_network

  # Cola de Mensajes RabbitMQ con interfaz web
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: local_rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"       # Protocolo AMQP
      - "${RABBITMQ_MGMT_PORT:-15672}:15672" # Panel Web de Administracion
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dev_network

  # Almacenamiento de objetos S3 compatible (MinIO)
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: local_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"         # API S3
      - "${MINIO_CONSOLE_PORT:-9001}:9001" # Consola Web MinIO
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    networks:
      - dev_network

  # Servidor SMTP de desarrollo y visor de correos (Mailpit)
  mailpit:
    image: axllent/mailpit:v1.18
    container_name: local_mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # Servidor SMTP
      - "${MAILPIT_HTTP_PORT:-8025}:8025" # Interfaz Web para ver correos enviados
    networks:
      - dev_network

volumes:
  postgres_data:
    name: local_postgres_data
  redis_data:
    name: local_redis_data
  rabbitmq_data:
    name: local_rabbitmq_data
  minio_data:
    name: local_minio_data

networks:
  dev_network:
    name: local_dev_network
    driver: bridge
