---
- name: Crear directorio base para Traefik (/opt/traefik)
  ansible.builtin.file:
    path: /opt/traefik/data
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Crear archivo de certificados acme.json con permisos estrictos (0600)
  ansible.builtin.file:
    path: /opt/traefik/data/acme.json
    state: touch
    owner: root
    group: root
    mode: '0600'
    modification_time: preserve
    access_time: preserve

- name: Crear red Docker externa para el gateway perimetral (web_gateway)
  community.docker.docker_network:
    name: web_gateway
    driver: bridge
    state: present
