[defaults]
roles_path = roles
host_key_checking = True
retry_files_enabled = False
stdout_callback = yaml
bin_ansible_callbacks = True
interpreter_python = auto_silent

# Soporte para multiples identidades de cifrado (Vault IDs)
# Uso recomendado por linea de comando o variable de entorno:
# ansible-playbook -i inventories/personal/prod/hosts.yaml playbooks/site.yaml --vault-id personal@~/.vault-personal
# ansible-playbook -i inventories/work/prod/hosts.yaml playbooks/site.yaml --vault-id work@~/.vault-work

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o PreferredAuthentications=publickey
